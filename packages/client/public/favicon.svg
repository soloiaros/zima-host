<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1457e1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle (ZimaOS / CasaOS style) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="26" y="26" width="460" height="460" rx="102" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Server Blades -->
  <g transform="translate(96, 120)">
    <!-- Blade 1 (Top) -->
    <rect x="0" y="0" width="320" height="68" rx="16" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <circle cx="36" cy="34" r="8" fill="#10b981" />
    <circle cx="64" cy="34" r="8" fill="#38bdf8" />
    <line x1="104" y1="34" x2="280" y2="34" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 12" />

    <!-- Blade 2 (Middle) -->
    <rect x="0" y="96" width="320" height="68" rx="16" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <circle cx="36" cy="130" r="8" fill="#10b981" />
    <circle cx="64" cy="130" r="8" fill="#38bdf8" />
    <line x1="104" y1="130" x2="280" y2="130" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 12" />

    <!-- Blade 3 (Bottom) -->
    <rect x="0" y="192" width="320" height="68" rx="16" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <circle cx="36" cy="226" r="8" fill="#10b981" />
    <circle cx="64" cy="226" r="8" fill="#f59e0b" />
    <line x1="104" y1="226" x2="280" y2="226" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 12" />
  </g>

  <!-- Glowing Zima / Web Host Badge in Center -->
  <g transform="translate(256, 370)">
    <circle cx="0" cy="0" r="48" fill="#0f172a" stroke="url(#glowGrad)" stroke-width="6" />
    <!-- Globe / Network Nodes -->
    <circle cx="-16" cy="-8" r="6" fill="#38bdf8" />
    <circle cx="16" cy="-8" r="6" fill="#38bdf8" />
    <circle cx="0" cy="16" r="6" fill="#818cf8" />
    <line x1="-16" y1="-8" x2="16" y2="-8" stroke="#38bdf8" stroke-width="3" />
    <line x1="-16" y1="-8" x2="0" y2="16" stroke="#818cf8" stroke-width="3" />
    <line x1="16" y1="-8" x2="0" y2="16" stroke="#818cf8" stroke-width="3" />
  </g>
</svg>
