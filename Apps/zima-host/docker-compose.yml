name: zima-host

services:
  zima-host:
    image: zima-host:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zima-host
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /DATA/AppData/zima-host/data:/root/.zima-host
    networks:
      - zima-network
    depends_on:
      - caddy
    x-casaos:
      ports:
        - container: "3000"
          description:
            en_us: "Zima Host Web Management Panel"
      volumes:
        - container: "/root/.zima-host"
          description:
            en_us: "Projects directory, SQLite database, and runtime configs"
        - container: "/var/run/docker.sock"
          description:
            en_us: "Docker daemon socket for managing website containers"

  caddy:
    image: caddy:2-alpine
    container_name: zima-host-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /DATA/AppData/zima-host/data/Caddyfile:/etc/caddy/Caddyfile
      - /DATA/AppData/zima-host/caddy_data:/data
      - /DATA/AppData/zima-host/caddy_config:/config
    networks:
      - zima-network
    x-casaos:
      ports:
        - container: "80"
          description:
            en_us: "HTTP Ingress (Reverse Proxy)"
        - container: "443"
          description:
            en_us: "HTTPS Ingress (Automated SSL)"
      volumes:
        - container: "/etc/caddy/Caddyfile"
          description:
            en_us: "Dynamic Caddy configuration generated by Zima Host"
        - container: "/data"
          description:
            en_us: "Caddy SSL certificates and storage"
        - container: "/config"
          description:
            en_us: "Caddy runtime configuration"

networks:
  zima-network:
    name: zima-network
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  main: zima-host
  author: Yaroslav Solovev
  category: Developer
  description:
    en_us: "Self-hosted website management panel for ZimaBoard 2. Easily launch, host, and manage static and Node.js websites with zero recurring costs. Features one-click project setups, automated Caddy SSL reverse proxy, Cloudflare integration, container isolation, live log streaming, and real-time hardware telemetry."
  tagline:
    en_us: "Self-hosted zero-billing website management platform for ZimaBoard 2"
  developer: Zima Host
  icon: "https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/NginxProxyManager/icon.png"
  thumbnail: ""
  title:
    en_us: "Zima Host"
  index: /
  port_map: "3000"
  scheme: http
  tips:
    before_install:
      en_us: "Zima Host mounts /var/run/docker.sock to manage website containers and uses ports 80/443 for automated HTTPS routing."
